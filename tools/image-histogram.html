<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Histogram | ZyncTools</title>
    <meta name="description" content="Analyze image color distribution with RGB histogram. 100% client-side.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%236366F1'>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { inter: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        slate: { 950: '#0F1115', 900: '#13151A', 850: '#1C1F26', 800: '#23262F', 700: '#2D313A' },
                        accent: { DEFAULT: '#6366F1', light: '#818CF8', dark: '#4F46E5' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script>
        (function() {
            var themeKey = 'zync-theme-v2';
            var theme = 'dark';
            try { theme = localStorage.getItem(themeKey) || 'dark'; } catch(e) {}
            if (theme !== 'dark' && theme !== 'grass' && theme !== 'light') theme = 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.classList.add('theme-' + theme);
            document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
        })();
    </script>
    <script src="assets/js/theme.js" defer></script>
    <style>
        .histogram-canvas {
            background: var(--bg-surface);
            border-radius: 12px;
            width: 100%;
            height: 300px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .channel-btn {
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-medium);
            background: var(--bg-surface);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .channel-btn.active {
            background: var(--accent);
            color: var(--accent-contrast);
            border-color: var(--accent);
        }
    </style>
</head>
<body class="min-h-screen bg-[#0B0C10] text-white">
    <header class="border-b border-white/5 bg-[#0B0C10]">
        <div class="mx-auto max-w-7xl px-6 h-14 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-8 h-8 rounded-lg bg-accent/10 border border-accent/20 flex items-center justify-center text-accent font-bold text-lg group-hover:bg-accent/20 transition-colors">⚡</div>
                <span class="text-lg font-bold tracking-tight text-white">ZyncTools</span>
            </a>
            <nav class="hidden md:flex items-center gap-8">
                <a href="/" class="text-sm text-gray-400 hover:text-white transition-colors">All Tools</a>
                <button id="theme-toggle" class="text-sm text-gray-400 hover:text-white transition-colors" aria-label="Toggle theme">
                    <i data-lucide="moon" class="w-4 h-4"></i>
                </button>
            </nav>
        </div>
    </header>

    <main class="py-10">
        <div class="mx-auto max-w-7xl px-6">
            <div class="mb-8">
                <div class="flex items-center gap-4 mb-2">
                    <div class="w-12 h-12 rounded-xl bg-accent/10 border border-accent/20 flex items-center justify-center text-accent text-xl">
                        <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Image Histogram</h1>
                        <p class="text-gray-400 mt-1">Analyze the color distribution of your image.</p>
                    </div>
                </div>
            </div>

            <!-- Upload -->
            <div class="mb-8">
                <div class="step-label mb-3">
                    <span class="step-number">1</span>
                    <span class="step-title">Upload Image</span>
                </div>
                <div id="drop-zone" class="drop-zone">
                    <div class="pointer-events-none">
                        <svg class="w-12 h-12 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        <p class="text-white font-medium mb-1">Drag & drop an image here</p>
                        <p class="text-gray-500 text-sm">or click to browse</p>
                    </div>
                    <input type="file" id="file-input" accept="image/*" class="hidden" />
                </div>
                <div id="preview-section" class="mt-6 hidden">
                    <div class="preview-card">
                        <img id="preview-image" class="preview-image" />
                    </div>
                </div>
            </div>

            <!-- Histogram -->
            <div id="histogram-section" class="mb-8 hidden">
                <div class="step-label mb-3">
                    <span class="step-number">2</span>
                    <span class="step-title">Histogram</span>
                </div>
                <div class="tool-options-card mb-4">
                    <div class="flex flex-wrap gap-2">
                        <button class="channel-btn active" data-channel="rgb">RGB</button>
                        <button class="channel-btn" data-channel="r">Red</button>
                        <button class="channel-btn" data-channel="g">Green</button>
                        <button class="channel-btn" data-channel="b">Blue</button>
                        <button class="channel-btn" data-channel="l">Luminance</button>
                    </div>
                    <div class="mt-4">
                        <button id="export-histogram" class="btn-secondary">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            Export as PNG
                        </button>
                    </div>
                </div>
                <canvas id="histogram-canvas" class="histogram-canvas"></canvas>
            </div>

            <!-- Stats -->
            <div id="stats-section" class="mb-8 hidden">
                <div class="step-label mb-3">
                    <span class="step-number">3</span>
                    <span class="step-title">Image Statistics</span>
                </div>
                <div id="stats-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
            </div>
        </div>
    </main>

    <footer class="border-t border-white/5 py-8">
        <div class="mx-auto max-w-7xl px-6 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded bg-accent/10 border border-accent/20 flex items-center justify-center text-accent text-xs font-bold">⚡</div>
                <span class="text-sm font-semibold text-white">ZyncTools</span>
            </div>
            <p class="text-xs text-gray-500">100% client-side. No uploads. No tracking.</p>
        </div>
    </footer>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/tools/image-filters-logic.js"></script>
    <script>
        (function() {
            'use strict';
            var state = { file: null, channel: 'rgb', data: null };

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function formatFileSize(bytes) {
                if (!bytes && bytes !== 0) return '0 Bytes';
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            var dropZone = document.getElementById('drop-zone');
            var fileInput = document.getElementById('file-input');
            var previewSection = document.getElementById('preview-section');
            var previewImage = document.getElementById('preview-image');

            dropZone.addEventListener('click', function() { fileInput.click(); });
            dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
            dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
            dropZone.addEventListener('drop', function(e) {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            });
            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length) handleFile(e.target.files[0]);
            });

            function handleFile(file) {
                if (!file.type.startsWith('image/')) return;
                state.file = file;
                previewImage.onload = function() {
                    previewSection.classList.remove('hidden');
                    analyzeImage();
                };
                previewImage.src = URL.createObjectURL(file);
            }

            async function analyzeImage() {
                var bmp = await createImageBitmap(state.file);
                var c = document.createElement('canvas');
                c.width = bmp.width; c.height = bmp.height;
                var cx = c.getContext('2d');
                cx.drawImage(bmp, 0, 0);
                var d = cx.getImageData(0, 0, c.width, c.height).data;
                state.data = { width: bmp.width, height: bmp.height, data: d };

                var rh = new Array(256).fill(0), gh = new Array(256).fill(0), bh = new Array(256).fill(0), lh = new Array(256).fill(0);
                var rSum = 0, gSum = 0, bSum = 0, count = 0;
                for (let i = 0; i < d.length; i += 4) {
                    rh[d[i]]++; gh[d[i+1]]++; bh[d[i+2]]++;
                    var lum = Math.round(0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]);
                    lh[lum]++;
                    rSum += d[i]; gSum += d[i+1]; bSum += d[i+2]; count++;
                }

                state.histograms = { r: rh, g: gh, b: bh, l: lh };
                state.stats = {
                    width: bmp.width,
                    height: bmp.height,
                    size: formatFileSize(state.file.size),
                    format: state.file.type || 'image/' + state.file.name.split('.').pop(),
                    avgColor: 'RGB(' + Math.round(rSum/count) + ', ' + Math.round(gSum/count) + ', ' + Math.round(bSum/count) + ')',
                    aspectRatio: (bmp.width / bmp.height).toFixed(2)
                };

                document.getElementById('histogram-section').classList.remove('hidden');
                document.getElementById('stats-section').classList.remove('hidden');
                drawHistogram();
                renderStats();
            }

            function drawHistogram() {
                var canvas = document.getElementById('histogram-canvas');
                var ctx = canvas.getContext('2d');
                var w = canvas.width = canvas.offsetWidth * 2;
                var h = canvas.height = canvas.offsetHeight * 2;
                ctx.scale(2, 2);
                var cw = w / 2, ch = h / 2;

                ctx.clearRect(0, 0, cw, ch);
                ctx.fillStyle = '#111318';
                ctx.fillRect(0, 0, cw, ch);

                var channel = state.channel;
                var hist = state.histograms[channel];
                if (!hist) return;

                var max = Math.max(...hist);
                var colors = { r: '#ef4444', g: '#10b981', b: '#3b82f6', l: '#9ca3af', rgb: ['#ef4444', '#10b981', '#3b82f6'] };
                var barW = cw / 256;

                if (channel === 'rgb') {
                    ['r', 'g', 'b'].forEach(function(ch, ci) {
                        var h = state.histograms[ch];
                        ctx.fillStyle = colors.rgb[ci];
                        ctx.globalAlpha = 0.4;
                        for (let i = 0; i < 256; i++) {
                            var barH = (h[i] / max) * (ch - 20);
                            ctx.fillRect(i * barW, ch - barH, barW, barH);
                        }
                    });
                    ctx.globalAlpha = 1;
                } else {
                    ctx.fillStyle = colors[channel] || '#6366f1';
                    for (let i = 0; i < 256; i++) {
                        var barH = (hist[i] / max) * (ch - 20);
                        ctx.fillRect(i * barW, ch - barH, barW, barH);
                    }
                }

                // Axes
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, ch - 20); ctx.lineTo(cw, ch - 20);
                ctx.stroke();
            }

            function renderStats() {
                var grid = document.getElementById('stats-grid');
                var s = state.stats;
                grid.innerHTML = [
                    { label: 'Width', value: s.width + 'px' },
                    { label: 'Height', value: s.height + 'px' },
                    { label: 'File Size', value: s.size },
                    { label: 'Format', value: s.format },
                    { label: 'Aspect Ratio', value: s.aspectRatio },
                    { label: 'Avg Color', value: s.avgColor },
                ].map(function(stat) {
                    return '<div class="stat-card"><div class="text-xs text-gray-500 uppercase tracking-wider mb-1">' + stat.label + '</div><div class="text-sm font-bold text-white">' + stat.value + '</div></div>';
                }).join('');
            }

            // Channel buttons
            document.querySelectorAll('.channel-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.channel-btn').forEach(function(b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    state.channel = btn.dataset.channel;
                    drawHistogram();
                });
            });

            // Export
            document.getElementById('export-histogram').addEventListener('click', function() {
                var canvas = document.getElementById('histogram-canvas');
                var link = document.createElement('a');
                link.download = 'histogram.png';
                link.href = canvas.toDataURL();
                link.click();
            });

            var themeToggleBtn = document.getElementById('theme-toggle');
            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', function() {
                    if (window.ZyncTheme) window.ZyncTheme.toggle();
                    else if (window.themeManager) window.themeManager.toggle();
                });
            }

            if (window.lucide) lucide.createIcons();
        })();
    </script>
</body>
</html>
