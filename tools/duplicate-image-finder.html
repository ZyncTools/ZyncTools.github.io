<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplicate Image Finder | ZyncTools</title>
    <meta name="description" content="Find duplicate and similar images in your browser. 100% client-side.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%236366F1'>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { inter: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        slate: { 950: '#0F1115', 900: '#13151A', 850: '#1C1F26', 800: '#23262F', 700: '#2D313A' },
                        accent: { DEFAULT: '#6366F1', light: '#818CF8', dark: '#4F46E5' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script>
        (function() {
            var themeKey = 'zync-theme-v2';
            var theme = 'dark';
            try { theme = localStorage.getItem(themeKey) || 'dark'; } catch(e) {}
            if (theme !== 'dark' && theme !== 'grass' && theme !== 'light') theme = 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.classList.add('theme-' + theme);
            document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
        })();
    </script>
    <script src="assets/js/theme.js" defer></script>
    <style>
        .dup-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 16px;
            transition: all 0.3s ease;
            position: relative;
        }
        .dup-card:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .dup-card.exact {
            border-color: var(--danger);
            box-shadow: 0 0 0 1px var(--danger);
        }
        .dup-card.similar {
            border-color: var(--warning);
            box-shadow: 0 0 0 1px var(--warning);
        }
        .dup-thumb {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 10px;
            background: var(--bg-surface);
        }
        .dup-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .dup-badge.exact { background: rgba(239,68,68,0.2); color: #ef4444; }
        .dup-badge.similar { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .similarity-bar {
            height: 6px;
            border-radius: 999px;
            background: var(--border-medium);
            overflow: hidden;
            margin-top: 8px;
        }
        .similarity-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body class="min-h-screen bg-[#0B0C10] text-white">
    <header class="border-b border-white/5 bg-[#0B0C10]">
        <div class="mx-auto max-w-7xl px-6 h-14 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-8 h-8 rounded-lg bg-accent/10 border border-accent/20 flex items-center justify-center text-accent font-bold text-lg group-hover:bg-accent/20 transition-colors">⚡</div>
                <span class="text-lg font-bold tracking-tight text-white">ZyncTools</span>
            </a>
            <nav class="hidden md:flex items-center gap-8">
                <a href="/" class="text-sm text-gray-400 hover:text-white transition-colors">All Tools</a>
                <button id="theme-toggle" class="text-sm text-gray-400 hover:text-white transition-colors" aria-label="Toggle theme">
                    <i data-lucide="moon" class="w-4 h-4"></i>
                </button>
            </nav>
        </div>
    </header>

    <main class="py-10">
        <div class="mx-auto max-w-7xl px-6">
            <div class="mb-8">
                <div class="flex items-center gap-4 mb-2">
                    <div class="w-12 h-12 rounded-xl bg-accent/10 border border-accent/20 flex items-center justify-center text-accent text-xl">
                        <i data-lucide="copy" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Duplicate Image Finder</h1>
                        <p class="text-gray-400 mt-1">Upload multiple images to find exact and visually similar duplicates.</p>
                    </div>
                </div>
            </div>

            <!-- Upload -->
            <div class="mb-8">
                <div class="step-label mb-3">
                    <span class="step-number">1</span>
                    <span class="step-title">Upload Images</span>
                </div>
                <div id="drop-zone" class="drop-zone">
                    <div class="pointer-events-none">
                        <svg class="w-12 h-12 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                        <p class="text-white font-medium mb-1">Drag & drop images here</p>
                        <p class="text-gray-500 text-sm">or click to browse</p>
                    </div>
                    <input type="file" id="file-input" multiple accept="image/*" class="hidden" />
                </div>
                <div id="file-list" class="mt-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
            </div>

            <!-- Settings -->
            <div class="mb-8">
                <div class="step-label mb-3">
                    <span class="step-number">2</span>
                    <span class="step-title">Settings</span>
                </div>
                <div class="tool-options-card">
                    <div class="grid md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-white mb-2">Similarity Threshold</label>
                            <input type="range" id="threshold" min="50" max="100" value="90" class="w-full accent-accent" />
                            <div class="flex justify-between text-xs text-gray-400 mt-1"><span>50%</span><span id="threshold-val">90%</span><span>100%</span></div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-white mb-2">Sort By</label>
                            <select id="sort-by" class="w-full bg-[#111318] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-gray-200">
                                <option value="name">Name</option>
                                <option value="size">Size</option>
                                <option value="similarity">Similarity</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button id="find-dups" class="process-btn w-full" disabled>
                                <i data-lucide="search" class="w-4 h-4"></i>
                                Find Duplicates
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div id="results-section" class="hidden">
                <div class="step-label mb-3">
                    <span class="step-number">3</span>
                    <span class="step-title">Results</span>
                </div>
                <div id="dup-summary" class="tool-options-card mb-6"></div>
                <div id="dup-groups" class="space-y-6"></div>
            </div>
        </div>
    </main>

    <footer class="border-t border-white/5 py-8">
        <div class="mx-auto max-w-7xl px-6 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded bg-accent/10 border border-accent/20 flex items-center justify-center text-accent text-xs font-bold">⚡</div>
                <span class="text-sm font-semibold text-white">ZyncTools</span>
            </div>
            <p class="text-xs text-gray-500">100% client-side. No uploads. No tracking.</p>
        </div>
    </footer>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/tools/image-light-logic.js"></script>
    <script src="assets/js/tools/image-filters-logic.js"></script>
    <script>
        (function() {
            'use strict';
            var files = [];
            var results = [];

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function formatFileSize(bytes) {
                if (!bytes && bytes !== 0) return '0 Bytes';
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            var dropZone = document.getElementById('drop-zone');
            var fileInput = document.getElementById('file-input');
            var fileList = document.getElementById('file-list');
            var findBtn = document.getElementById('find-dups');

            dropZone.addEventListener('click', function() { fileInput.click(); });
            dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
            dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
            dropZone.addEventListener('drop', function(e) {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                handleFiles(e.dataTransfer.files);
            });
            fileInput.addEventListener('change', function(e) {
                handleFiles(e.target.files);
                fileInput.value = '';
            });

            function handleFiles(fileListObj) {
                Array.from(fileListObj).forEach(function(file) {
                    if (!file.type.startsWith('image/')) return;
                    files.push(file);
                    var item = document.createElement('div');
                    item.className = 'dup-card';
                    item.innerHTML = '<img class="dup-thumb" src="' + URL.createObjectURL(file) + '" alt="" />' +
                        '<div class="mt-2 text-xs text-gray-400 truncate">' + escapeHtml(file.name) + '</div>' +
                        '<div class="text-xs text-gray-500">' + formatFileSize(file.size) + '</div>' +
                        '<button class="absolute top-2 left-2 w-6 h-6 rounded-full bg-black/50 text-white text-xs flex items-center justify-center hover:bg-red-500 transition-colors remove-btn">&times;</button>';
                    fileList.appendChild(item);
                    item.querySelector('.remove-btn').addEventListener('click', function() {
                        var idx = files.indexOf(file);
                        if (idx > -1) files.splice(idx, 1);
                        item.remove();
                        findBtn.disabled = files.length < 2;
                    });
                });
                findBtn.disabled = files.length < 2;
            }

            document.getElementById('threshold').addEventListener('input', function() {
                document.getElementById('threshold-val').textContent = this.value + '%';
            });

            findBtn.addEventListener('click', async function() {
                if (files.length < 2) return;
                findBtn.disabled = true;
                findBtn.innerHTML = '<span class="animate-spin inline-block w-4 h-4 border-2 border-white/20 border-t-white rounded-full mr-2"></span>Scanning...';

                try {
                    var ha = await Promise.all(files.map(async f => {
                        const buf = new Uint8Array(await f.arrayBuffer());
                        let h = 0x811c9dc5;
                        for (let i = 0; i < buf.length; i += 997) { h ^= buf[i]; h = Math.imul(h, 0x01000193); }
                        return (h >>> 0);
                    }));
                    var seen = {};
                    var groups = [];
                    files.forEach((f, i) => {
                        var key = ha[i];
                        if (seen[key] !== undefined) {
                            if (!groups.find(g => g.indexOf(seen[key]) !== -1)) {
                                groups.push([seen[key]]);
                            }
                            groups.find(g => g.indexOf(seen[key]) !== -1).push(i);
                        } else {
                            seen[key] = i;
                        }
                    });

                    // Also check visual similarity for near-duplicates
                    var visualGroups = [];
                    if (groups.length === 0) {
                        var threshold = parseInt(document.getElementById('threshold').value) / 100;
                        for (let i = 0; i < files.length; i++) {
                            for (let j = i + 1; j < files.length; j++) {
                                var similarity = await computeSimilarity(files[i], files[j]);
                                if (similarity >= threshold) {
                                    visualGroups.push({ i: i, j: j, similarity: similarity });
                                }
                            }
                        }
                    }

                    renderResults(groups, visualGroups);
                } catch (err) {
                    console.error(err);
                    alert('Error: ' + err.message);
                } finally {
                    findBtn.disabled = false;
                    findBtn.innerHTML = '<i data-lucide="search" class="w-4 h-4"></i> Find Duplicates';
                    if (window.lucide) lucide.createIcons();
                }
            });

            async function computeSimilarity(f1, f2) {
                var [a, b] = await Promise.all([createImageBitmap(f1), createImageBitmap(f2)]);
                var w = Math.min(a.width, b.width, 100);
                var h = Math.min(a.height, b.height, 100);
                var ca = document.createElement('canvas'); ca.width = w; ca.height = h;
                var cb = document.createElement('canvas'); cb.width = w; cb.height = h;
                ca.getContext('2d').drawImage(a, 0, 0, w, h);
                cb.getContext('2d').drawImage(b, 0, 0, w, h);
                var da = ca.getContext('2d').getImageData(0, 0, w, h).data, db = cb.getContext('2d').getImageData(0, 0, w, h).data;
                var same = 0;
                for (let i = 0; i < da.length; i += 4) {
                    if (Math.abs(da[i] - db[i]) + Math.abs(da[i+1] - db[i+1]) + Math.abs(da[i+2] - db[i+2]) < 30) same++;
                }
                return same / (w * h);
            }

            function renderResults(groups, visualGroups) {
                var section = document.getElementById('results-section');
                var summary = document.getElementById('dup-summary');
                var container = document.getElementById('dup-groups');
                section.classList.remove('hidden');

                var totalExact = groups.length;
                var totalVisual = visualGroups.length;
                summary.innerHTML = '<div class="flex flex-wrap gap-4 text-sm">' +
                    '<div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-red-500"></span><span class="text-gray-300">Exact duplicates: <strong class="text-white">' + totalExact + '</strong></span></div>' +
                    '<div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-yellow-500"></span><span class="text-gray-300">Similar images: <strong class="text-white">' + totalVisual + '</strong></span></div>' +
                    '<div class="flex items-center gap-2"><span class="text-gray-400">Total images scanned: <strong class="text-white">' + files.length + '</strong></span></div>' +
                    '</div>';

                container.innerHTML = '';

                groups.forEach(function(group) {
                    var card = document.createElement('div');
                    card.className = 'dup-card exact';
                    var imgs = group.map(idx => files[idx]).filter(Boolean);
                    card.innerHTML = '<div class="flex items-center gap-2 mb-3"><span class="dup-badge exact">Exact Duplicate</span></div>' +
                        '<div class="grid grid-cols-2 md:grid-cols-4 gap-3">' +
                        imgs.map(f => '<div class="text-center"><img class="dup-thumb mx-auto" src="' + URL.createObjectURL(f) + '" alt="" /><div class="text-xs text-gray-400 mt-1 truncate">' + escapeHtml(f.name) + '</div><div class="text-xs text-gray-500">' + formatFileSize(f.size) + '</div></div>').join('') +
                        '</div>';
                    container.appendChild(card);
                });

                visualGroups.forEach(function(g) {
                    var card = document.createElement('div');
                    card.className = 'dup-card similar';
                    card.innerHTML = '<div class="flex items-center gap-2 mb-3"><span class="dup-badge similar">Similar (' + Math.round(g.similarity * 100) + '%)</span></div>' +
                        '<div class="grid grid-cols-2 gap-3">' +
                        '<div class="text-center"><img class="dup-thumb mx-auto" src="' + URL.createObjectURL(files[g.i]) + '" alt="" /><div class="text-xs text-gray-400 mt-1 truncate">' + escapeHtml(files[g.i].name) + '</div></div>' +
                        '<div class="text-center"><img class="dup-thumb mx-auto" src="' + URL.createObjectURL(files[g.j]) + '" alt="" /><div class="text-xs text-gray-400 mt-1 truncate">' + escapeHtml(files[g.j].name) + '</div></div>' +
                        '</div>' +
                        '<div class="similarity-bar"><div class="similarity-fill bg-yellow-500" style="width:' + Math.round(g.similarity * 100) + '%"></div></div>';
                    container.appendChild(card);
                });

                if (window.lucide) lucide.createIcons();
            }

            var themeToggleBtn = document.getElementById('theme-toggle');
            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', function() {
                    if (window.ZyncTheme) window.ZyncTheme.toggle();
                    else if (window.themeManager) window.themeManager.toggle();
                });
            }

            if (window.lucide) lucide.createIcons();
        })();
    </script>
</body>
</html>
