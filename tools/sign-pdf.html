<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign PDF — Free, Private, Fast | ZyncTools</title>
    <meta name="description" content="Sign PDF documents with typed, drawn, or uploaded signatures. 100% client-side, no uploads.">
    <link rel="icon" href="assets/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script>(function() { var t = 'dark'; try { t = localStorage.getItem('zync-theme-v2') || 'dark'; } catch(e) {} document.documentElement.setAttribute('data-theme', t); document.documentElement.style.colorScheme = t; })();</script>
    <script>window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <style>
        .sig-canvas-wrap { position: relative; border: 2px dashed var(--border-medium); border-radius: 12px; background: white; overflow: hidden; }
        .sig-canvas { display: block; width: 100%; touch-action: none; cursor: crosshair; }
        .sig-preview-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .sig-chip { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-medium); background: var(--bg-surface); cursor: pointer; transition: all 0.15s ease; }
        .sig-chip:hover { border-color: var(--accent); background: var(--accent-tint); }
        .sig-chip.active { border-color: var(--accent); background: var(--accent-tint); box-shadow: 0 0 0 3px var(--accent-tint); }
        .sig-chip img { max-height: 30px; max-width: 60px; }
        .sig-chip canvas { height: 30px; }
        .sig-chips-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .sig-modes { display: flex; gap: 8px; margin-bottom: 12px; }
        .sig-mode-btn { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border-medium); background: var(--bg-surface); color: var(--text-secondary); cursor: pointer; transition: all 0.15s ease; font-family: inherit; font-size: 0.85rem; font-weight: 600; }
        .sig-mode-btn.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
        .sig-mode-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent-dark); }
    </style>
</head>
<body>
<header class="border-b border-white/5 bg-[#0B0C10]">
    <div class="mx-auto max-w-7xl px-6 h-14 flex items-center justify-between">
        <a href="/" class="flex items-center gap-3 group">
            <div class="w-8 h-8 rounded-lg bg-accent/10 border border-accent/20 flex items-center justify-center text-accent font-bold text-lg group-hover:bg-accent/20 transition-colors">⚡</div>
            <span class="text-lg font-bold tracking-tight text-white">ZyncTools</span>
        </a>
    </div>
</header>
<main class="py-8">
    <div class="mx-auto max-w-7xl px-6">
        <div class="flex items-center gap-4 mb-6">
            <div class="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-500 text-xl"><i class="fas fa-pen-nib"></i></div>
            <div><h1 class="text-2xl font-bold text-white tracking-tight">Sign PDF</h1><p class="text-gray-400 mt-1">Add typed, drawn, or uploaded signatures.</p></div>
        </div>
        <div id="upload-area" class="mb-8">
            <div class="step-label mb-3"><span class="step-number">1</span><span class="step-title">Upload Document</span></div>
            <div id="drop-zone" class="drop-zone">
                <svg class="w-12 h-12 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                <p class="text-white font-medium mb-1">Drag & drop your PDF here</p>
                <p class="text-gray-500 text-sm">or click to browse</p>
                <input type="file" id="file-input" accept=".pdf" class="hidden">
            </div>
        </div>
        <div id="file-info" class="mb-6 hidden">
            <div class="sidebar-card flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-500"><i class="fas fa-file-pdf"></i></div>
                <div class="flex-1 min-w-0"><div class="font-semibold text-sm text-white truncate" id="file-name">document.pdf</div><div class="text-xs text-gray-500" id="file-size">0 KB</div></div>
                <button id="replace-file-btn" class="btn btn-secondary btn-sm"><i class="fas fa-rotate-right"></i> Replace</button>
            </div>
        </div>
        <div id="pdf-workbench-area" class="hidden">
            <div class="pdf-workbench" style="height:auto;">
                <div class="pdf-main-viewer" style="min-height:600px">
                    <div class="pdf-toolbar">
                        <div class="pdf-toolbar-group">
                            <button class="pdf-toolbar-btn" id="prev-page"><i class="fas fa-chevron-up"></i></button>
                            <span class="pdf-page-nav"><span><input type="number" id="page-input" class="pdf-page-input" value="1" min="1"></span><span>/</span><span id="total-pages-span">1</span></span>
                            <button class="pdf-toolbar-btn" id="next-page"><i class="fas fa-chevron-down"></i></button>
                        </div>
                        <div class="pdf-toolbar-group">
                            <button class="pdf-toolbar-btn" id="zoom-out"><i class="fas fa-magnifying-glass-minus"></i></button>
                            <span class="text-xs text-gray-400 font-semibold" id="zoom-level">100%</span>
                            <button class="pdf-toolbar-btn" id="zoom-in"><i class="fas fa-magnifying-glass-plus"></i></button>
                        </div>
                    </div>
                    <div class="pdf-canvas-container" id="pdf-canvas-container">
                        <div class="pdf-canvas-wrapper" id="pdf-canvas-wrapper"><canvas id="pdf-current-canvas"></canvas><canvas id="pdf-annotation-layer" class="pdf-annotation-layer"></canvas></div>
                    </div>
                </div>
                <div class="pdf-tools-panel">
                    <div class="tool-panel-card">
                        <div class="tool-panel-title"><i class="fas fa-pen-nib mr-1"></i> Signature Mode</div>
                        <div class="sig-modes">
                            <button class="sig-mode-btn active" data-mode="draw"><i class="fas fa-pencil"></i> Draw</button>
                            <button class="sig-mode-btn" data-mode="type"><i class="fas fa-keyboard"></i> Type</button>
                            <button class="sig-mode-btn" data-mode="upload"><i class="fas fa-upload"></i> Upload</button>
                        </div>
                        <div id="sig-draw-section">
                            <div class="sig-canvas-wrap">
                                <canvas id="sig-canvas" class="sig-canvas" height="120"></canvas>
                            </div>
                            <div class="mt-2 flex gap-2">
                                <button id="sig-clear-btn" class="btn btn-secondary btn-sm"><i class="fas fa-trash"></i> Clear</button>
                                <button id="sig-save-btn" class="btn btn-primary btn-sm"><i class="fas fa-save"></i> Save Sig</button>
                            </div>
                        </div>
                        <div id="sig-type-section" class="hidden">
                            <div class="form-group"><label class="form-label">Type your signature</label><input id="sig-text-input" type="text" class="form-input" placeholder="Your Name" value="John Doe"></div>
                            <div class="form-group"><label class="form-label">Font</label><select id="sig-font" class="form-select"><option value="Inter">Inter</option><option value="Brush Script MT">Brush Script</option><option value="cursive">Cursive</option><option value="serif">Serif</option></select></div>
                            <button id="sig-save-text-btn" class="btn btn-primary btn-sm btn-full"><i class="fas fa-save"></i> Save Text Sig</button>
                        </div>
                        <div id="sig-upload-section" class="hidden">
                            <div class="form-group"><label class="form-label">Upload signature image</label><input id="sig-upload-input" type="file" accept="image/*" class="form-input" style="padding:8px"></div>
                            <button id="sig-save-upload-btn" class="btn btn-primary btn-sm btn-full hidden"><i class="fas fa-save"></i> Save Uploaded Sig</button>
                        </div>
                        <div class="sig-chips-row" id="sig-chips-row"></div>
                        <p class="text-xs text-gray-500 mt-2">Select and drag a signature onto the PDF.</p>
                    </div>
                    <div class="tool-panel-card">
                        <div class="tool-panel-title"><i class="fas fa-file-export mr-1"></i> Export</div>
                        <button id="download-signed-btn" class="btn btn-primary btn-full mb-2"><i class="fas fa-download"></i> Download Signed PDF</button>
                        <button id="reset-btn" class="btn btn-secondary btn-full"><i class="fas fa-rotate-left"></i> Reset</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div id="loading-overlay" class="pdf-overlay">
    <div class="pdf-progress-card">
        <div class="text-2xl font-bold text-white mb-2"><i class="fas fa-spinner fa-spin"></i></div>
        <div class="text-sm text-gray-400 font-semibold" id="loading-text">Processing...</div>
        <div class="pdf-progress-bar-wrap"><div class="pdf-progress-bar-fill" id="loading-progress"></div></div>
    </div>
</div>
<div id="drop-overlay" class="pdf-upload-overlay"><div class="pdf-drop-indicator"><i class="fas fa-cloud-arrow-up text-5xl text-accent"></i><p class="text-lg font-bold text-white">Drop your PDF here</p></div></div>
<div id="toast-el" class="toast"></div>
<script src="assets/js/pdf-workbench-core.js"></script>
<script>
(function() {
  var $ = function(id) { return document.getElementById(id); };
  var pdfDoc = null;
  var currentPage = 1;
  var totalPages = 0;
  var zoomScale = 1.2;
  var loadedFile = null;
  var sigMode = 'draw';
  var signatures = [];
  var sigIdCounter = 1;
  var activeSig = null;
  var draggingSig = false;
  var dragOffsetX = 0;
  var dragOffsetY = 0;
  
  function formatBytes(b) { if (b === 0) return '0 B'; var k = 1024; var sizes = ['B', 'KB', 'MB', 'GB']; var i = Math.floor(Math.log(b) / Math.log(k)); return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i]; }
  function showToast(msg, type) { var t = $('toast-el'); t.textContent = msg; t.className = 'toast toast-' + (type || 'info') + ' visible'; clearTimeout(t._timer); t._timer = setTimeout(function() { t.classList.remove('visible'); }, 3000); }
  function showLoading(text, progress) { $('loading-text').textContent = text || 'Processing...'; $('loading-progress').style.width = (progress || 0) + '%'; $('loading-overlay').classList.add('visible'); if (progress >= 100) setTimeout(function() { $('loading-overlay').classList.remove('visible'); }, 400); }
  function hideLoading() { $('loading-overlay').classList.remove('visible'); }
  
  var dropZone = $('drop-zone');
  var fileInput = $('file-input');
  var dropOverlay = $('drop-overlay');
  dropZone.addEventListener('click', function() { fileInput.click(); });
  fileInput.addEventListener('change', function(e) { if (e.target.files[0]) handleFile(e.target.files[0]); });
  dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
  dropZone.addEventListener('drop', function(e) { e.preventDefault(); dropZone.classList.remove('drag-over'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  document.addEventListener('dragenter', function(e) { if (e.dataTransfer.types.includes('Files')) dropOverlay.classList.add('visible'); });
  document.addEventListener('dragover', function(e) { e.preventDefault(); });
  document.addEventListener('dragleave', function(e) { if (e.target === dropOverlay) dropOverlay.classList.remove('visible'); });
  document.addEventListener('drop', function(e) { e.preventDefault(); dropOverlay.classList.remove('visible'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  
  function handleFile(file) {
    if (file.type !== 'application/pdf' && !file.name.endsWith('.pdf')) { showToast('Please upload a PDF file', 'error'); return; }
    $('file-name').textContent = file.name;
    $('file-size').textContent = formatBytes(file.size);
    $('file-info').classList.remove('hidden');
    showLoading('Loading PDF...', 30);
    initPdfReader(file).then(function() { hideLoading(); showToast('PDF loaded: ' + totalPages + ' pages', 'success'); }).catch(function(e) { hideLoading(); showToast('Error: ' + e.message, 'error'); });
  }
  
  async function initPdfReader(file) {
    pdfDoc = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    totalPages = pdfDoc.numPages;
    currentPage = 1;
    zoomScale = 1.2;
    loadedFile = file;
    signatures = [];
    activeSig = null;
    sigIdCounter = 1;
    $('total-pages-span').textContent = totalPages;
    $('page-input').max = totalPages;
    $('page-input').value = 1;
    $('upload-area').classList.add('hidden');
    $('pdf-workbench-area').classList.remove('hidden');
    await renderCurrentPage();
    renderSignatures();
  }
  
  async function renderCurrentPage() {
    if (!pdfDoc) return;
    var canvas = $('pdf-current-canvas');
    try {
      var page = await pdfDoc.getPage(currentPage);
      var viewport = page.getViewport({ scale: zoomScale });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      $('pdf-canvas-wrapper').style.width = viewport.width + 'px';
      $('pdf-canvas-wrapper').style.height = viewport.height + 'px';
      var ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    } catch (e) { console.error('Render:', e); }
  }
  
  function renderSignatures() {
    var annLayer = $('pdf-annotation-layer');
    if (!annLayer) return;
    var ctx = annLayer.getContext('2d');
    ctx.clearRect(0, 0, annLayer.width, annLayer.height);
    for (var i = 0; i < signatures.length; i++) {
      var s = signatures[i];
      if (s.page !== currentPage) continue;
      var img = s.img;
      if (!img) continue;
      var w = img.width * (s.scale || 1);
      var h = img.height * (s.scale || 1);
      ctx.drawImage(img, s.x * zoomScale, s.y * zoomScale, w, h);
    }
  }
  
  function goToPage(page) { if (!pdfDoc || page < 1 || page > totalPages) return; currentPage = page; $('page-input').value = page; renderCurrentPage(); renderSignatures(); }
  $('prev-page').addEventListener('click', function() { goToPage(currentPage - 1); });
  $('next-page').addEventListener('click', function() { goToPage(currentPage + 1); });
  $('page-input').addEventListener('change', function() { goToPage(parseInt($('page-input').value) || 1); });
  $('zoom-in').addEventListener('click', function() { zoomScale = Math.min(zoomScale + 0.2, 5); $('zoom-level').textContent = Math.round(zoomScale * 100) + '%'; renderCurrentPage(); renderSignatures(); });
  $('zoom-out').addEventListener('click', function() { zoomScale = Math.max(zoomScale - 0.2, 0.3); $('zoom-level').textContent = Math.round(zoomScale * 100) + '%'; renderCurrentPage(); renderSignatures(); });
  
  // Signature drawing
  var sigCanvas = $('sig-canvas');
  var sigCtx = sigCanvas.getContext('2d');
  var drawing = false;
  var paths = [];
  var currentPath = [];
  
  function resizeSigCanvas() {
    var rect = sigCanvas.parentElement.getBoundingClientRect();
    sigCanvas.width = rect.width || 400;
    sigCanvas.height = 120;
    sigCtx.strokeStyle = '#000000';
    sigCtx.lineWidth = 3;
    sigCtx.lineCap = 'round';
    sigCtx.lineJoin = 'round';
  }
  
  function redrawSigCanvas() {
    sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
    sigCtx.strokeStyle = '#000000';
    sigCtx.lineWidth = 3;
    sigCtx.lineCap = 'round';
    sigCtx.lineJoin = 'round';
    if (paths.length === 0) {
      sigCtx.font = 'italic 30px cursive, serif';
      sigCtx.fillStyle = '#9CA3AF';
      sigCtx.fillText('Draw signature here', 20, 75);
      return;
    }
    for (var p = 0; p < paths.length; p++) {
      var path = paths[p];
      if (path.length < 2) continue;
      sigCtx.beginPath();
      sigCtx.moveTo(path[0].x, path[0].y);
      for (var i = 1; i < path.length; i++) {
        sigCtx.lineTo(path[i].x, path[i].y);
      }
      sigCtx.stroke();
    }
  }
  
  function getPos(e) {
    var rect = sigCanvas.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }
  
  sigCanvas.addEventListener('mousedown', function(e) { drawing = true; currentPath = [getPos(e)]; });
  sigCanvas.addEventListener('touchstart', function(e) { e.preventDefault(); drawing = true; currentPath = [getPos(e)]; }, { passive: false });
  sigCanvas.addEventListener('mousemove', function(e) { if (!drawing) return; currentPath.push(getPos(e)); redrawSigCanvas(); });
  sigCanvas.addEventListener('touchmove', function(e) { e.preventDefault(); if (!drawing) return; currentPath.push(getPos(e)); redrawSigCanvas(); }, { passive: false });
  sigCanvas.addEventListener('mouseup', function() { if (drawing && currentPath.length > 1) paths.push(currentPath); drawing = false; currentPath = []; redrawSigCanvas(); });
  sigCanvas.addEventListener('touchend', function(e) { if (drawing && currentPath.length > 1) paths.push(currentPath); drawing = false; currentPath = []; redrawSigCanvas(); });
  
  $('sig-clear-btn').addEventListener('click', function() { paths = []; redrawSigCanvas(); });
  
  $('sig-save-btn').addEventListener('click', function() {
    if (paths.length === 0) { showToast('Draw your signature first', 'error'); return; }
    var img = new Image();
    img.onload = function() {
      var sig = { id: sigIdCounter++, type: 'draw', page: currentPage, x: 50 * (1 / zoomScale), y: 200 * (1 / zoomScale), scale: 1, img: img };
      signatures.push(sig);
      activeSig = sig;
      renderSignatures();
      renderSigChips();
      showToast('Signature saved!', 'success');
    };
    img.src = sigCanvas.toDataURL();
  });
  
  // Type signature
  $('sig-save-text-btn').addEventListener('click', function() {
    var text = $('sig-text-input').value;
    if (!text) { showToast('Type your signature first', 'error'); return; }
    var c = document.createElement('canvas');
    c.width = 300;
    c.height = 80;
    var ctx = c.getContext('2d');
    var font = $('sig-font').value;
    ctx.font = '30px ' + font + ', cursive, serif';
    ctx.fillStyle = '#000000';
    ctx.fillText(text, 10, 55);
    var img = new Image();
    img.onload = function() {
      var sig = { id: sigIdCounter++, type: 'type', text: text, page: currentPage, x: 50 * (1 / zoomScale), y: 200 * (1 / zoomScale), scale: 1, img: img };
      signatures.push(sig);
      activeSig = sig;
      renderSignatures();
      renderSigChips();
      showToast('Text signature saved!', 'success');
    };
    img.src = c.toDataURL();
  });
  
  // Upload signature
  $('sig-upload-input').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      var img = new Image();
      img.onload = function() {
        $('sig-save-upload-btn').classList.remove('hidden');
        window._uploadedSigImg = img;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  $('sig-save-upload-btn').addEventListener('click', function() {
    var img = window._uploadedSigImg;
    if (!img) return;
    var sig = { id: sigIdCounter++, type: 'upload', page: currentPage, x: 50 * (1 / zoomScale), y: 200 * (1 / zoomScale), scale: 1, img: img };
    signatures.push(sig);
    activeSig = sig;
    renderSignatures();
    renderSigChips();
    showToast('Uploaded signature saved!', 'success');
  });
  
  // Mode switching
  document.querySelectorAll('.sig-mode-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.sig-mode-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      sigMode = btn.dataset.mode;
      $('sig-draw-section').classList.toggle('hidden', sigMode !== 'draw');
      $('sig-type-section').classList.toggle('hidden', sigMode !== 'type');
      $('sig-upload-section').classList.toggle('hidden', sigMode !== 'upload');
      if (sigMode === 'draw') setTimeout(resizeSigCanvas, 50);
    });
  });
  
  function renderSigChips() {
    var row = $('sig-chips-row');
    row.innerHTML = '';
    for (var i = signatures.length - 1; i >= 0; i--) {
      var s = signatures[i];
      var chip = document.createElement('div');
      chip.className = 'sig-chip';
      if (activeSig && activeSig.id === s.id) chip.classList.add('active');
      if (s.type === 'draw' || s.type === 'upload') {
        var c = document.createElement('canvas');
        var cCtx = c.getContext('2d');
        c.width = 60;
        c.height = 30;
        cCtx.drawImage(s.img, 0, 0, 60, 30);
        chip.appendChild(c);
      } else {
        var txt = document.createElement('span');
        txt.textContent = s.text || 'Sig';
        txt.style.fontSize = '0.75rem';
        chip.appendChild(txt);
      }
      chip.addEventListener('click', function() { activeSig = s; renderSignatures(); renderSigChips(); });
      chip.addEventListener('dblclick', function() {
        signatures = signatures.filter(function(x) { return x.id !== s.id; });
        if (activeSig && activeSig.id === s.id) activeSig = null;
        renderSignatures();
        renderSigChips();
      });
      row.appendChild(chip);
    }
  }
  
  // Drag & drop signatures onto PDF
  function setupSigDrag() {
    var container = $('pdf-canvas-container');
    var dragging = false;
    var selectedSig = null;
    var offX = 0, offY = 0;
    
    container.addEventListener('mousedown', function(e) {
      var annLayer = $('pdf-annotation-layer');
      var rect = annLayer.getBoundingClientRect();
      var mx = e.clientX - rect.left;
      var my = e.clientY - rect.top;
      for (var i = signatures.length - 1; i >= 0; i--) {
        var s = signatures[i];
        if (s.page !== currentPage) continue;
        var img = s.img;
        if (!img) continue;
        var w = img.width * (s.scale || 1);
        var h = img.height * (s.scale || 1);
        if (mx >= s.x * zoomScale && mx <= (s.x + w) * zoomScale && my >= s.y * zoomScale && my <= (s.y + h) * zoomScale) {
          selectedSig = s;
          dragging = true;
          offX = mx - s.x * zoomScale;
          offY = my - s.y * zoomScale;
          activeSig = s;
          renderSignatures();
          renderSigChips();
          break;
        }
      }
    });
    container.addEventListener('mousemove', function(e) {
      if (!dragging || !selectedSig) return;
      var rect = container.getBoundingClientRect();
      var mx = e.clientX - rect.left;
      var my = e.clientY - rect.top;
      selectedSig.x = (mx - offX) / zoomScale;
      selectedSig.y = (my - offY) / zoomScale;
      renderSignatures();
    });
    container.addEventListener('mouseup', function() { dragging = false; selectedSig = null; });
    container.addEventListener('mouseleave', function() { dragging = false; selectedSig = null; });
  }
  
  $('replace-file-btn').addEventListener('click', function() { fileInput.value = ''; fileInput.click(); });
  
  $('download-signed-btn').addEventListener('click', async function() {
    if (!pdfDoc || !loadedFile) return;
    showLoading('Signing PDF...', 30);
    try {
      var PDFLib = window.PDFLib;
      var bytes = new Uint8Array(await loadedFile.arrayBuffer());
      var doc = await PDFLib.PDFDocument.load(bytes);
      var pages = doc.getPages();
      for (var i = 0; i < signatures.length; i++) {
        var s = signatures[i];
        if (s.page < 1 || s.page > pages.length) continue;
        var page = doc.getPage(s.page);
        var [pw, ph] = page.getSize();
        var img = s.img;
        var imgData = img.src ? img.src.replace(/^data:image\/(png|jpeg|jpg|webp);base64,/, '') : null;
        if (!imgData) continue;
        var base64 = imgData;
        var sigImg = await doc.embedPng(base64);
        var w = img.width * 0.8;
        var h = img.height * 0.8;
        page.drawImage(sigImg, { x: s.x * pw / (400), y: ph - (s.y * ph / (400)) - h, width: Math.min(w, pw * 0.4), height: Math.min(h, ph * 0.3), opacity: 1 });
      }
      var outBytes = await doc.save();
      var blob = new Blob([outBytes], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'signed.pdf';
      a.click();
      URL.revokeObjectURL(url);
      hideLoading();
      showToast('Signed PDF downloaded!', 'success');
    } catch (e) {
      hideLoading();
      showToast('Error: ' + e.message, 'error');
    }
  });
  
  $('reset-btn').addEventListener('click', function() {
    $('upload-area').classList.remove('hidden');
    $('pdf-workbench-area').classList.add('hidden');
    $('file-info').classList.add('hidden');
    fileInput.value = '';
    pdfDoc = null;
    signatures = [];
    activeSig = null;
  });
  
  // Init
  setTimeout(function() {
    resizeSigCanvas();
    setupSigDrag();
  }, 100);
})();
</script>
</body>
</html>
