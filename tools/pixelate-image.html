<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelate Image | ZyncTools</title>
    <meta name="description" content="Pixelate images with adjustable pixel size and shape. 100% client-side.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%236366F1'>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { inter: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        slate: { 950: '#0F1115', 900: '#13151A', 850: '#1C1F26', 800: '#23262F', 700: '#2D313A' },
                        accent: { DEFAULT: '#6366F1', light: '#818CF8', dark: '#4F46E5' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script>
        (function() {
            var themeKey = 'zync-theme-v2';
            var theme = 'dark';
            try { theme = localStorage.getItem(themeKey) || 'dark'; } catch(e) {}
            if (theme !== 'dark' && theme !== 'grass' && theme !== 'light') theme = 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.classList.add('theme-' + theme);
            document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
        })();
    </script>
    <script src="assets/js/theme.js" defer></script>
    <style>
        .compare-slider {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--accent);
            cursor: ew-resize;
            z-index: 10;
            box-shadow: 0 0 8px var(--accent-glow);
        }
        .compare-slider::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            border: 3px solid white;
            box-shadow: var(--shadow-lg);
        }
    </style>
</head>
<body class="min-h-screen bg-[#0B0C10] text-white">
    <header class="border-b border-white/5 bg-[#0B0C10]">
        <div class="mx-auto max-w-7xl px-6 h-14 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-8 h-8 rounded-lg bg-accent/10 border border-accent/20 flex items-center justify-center text-accent font-bold text-lg group-hover:bg-accent/20 transition-colors">⚡</div>
                <span class="text-lg font-bold tracking-tight text-white">ZyncTools</span>
            </a>
            <nav class="hidden md:flex items-center gap-8">
                <a href="/" class="text-sm text-gray-400 hover:text-white transition-colors">All Tools</a>
                <button id="theme-toggle" class="text-sm text-gray-400 hover:text-white transition-colors" aria-label="Toggle theme">
                    <i data-lucide="moon" class="w-4 h-4"></i>
                </button>
            </nav>
        </div>
    </header>

    <main class="py-10">
        <div class="mx-auto max-w-7xl px-6">
            <div class="mb-8">
                <div class="flex items-center gap-4 mb-2">
                    <div class="w-12 h-12 rounded-xl bg-accent/10 border border-accent/20 flex items-center justify-center text-accent text-xl">
                        <i data-lucide="grid" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Pixelate Image</h1>
                        <p class="text-gray-400 mt-1">Apply a pixelation effect to your images with live preview.</p>
                    </div>
                </div>
            </div>

            <div class="grid lg:grid-cols-3 gap-6">
                <!-- Upload & Preview -->
                <div class="lg:col-span-2">
                    <div class="mb-6">
                        <div class="step-label mb-3">
                            <span class="step-number">1</span>
                            <span class="step-title">Upload Image</span>
                        </div>
                        <div id="drop-zone" class="drop-zone">
                            <div class="pointer-events-none">
                                <svg class="w-12 h-12 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                <p class="text-white font-medium mb-1">Drag & drop an image here</p>
                                <p class="text-gray-500 text-sm">or click to browse</p>
                            </div>
                            <input type="file" id="file-input" accept="image/*" class="hidden" />
                        </div>
                        <div id="preview-section" class="mt-6 hidden">
                            <div class="preview-card">
                                <div class="relative">
                                    <img id="preview-image" class="preview-image" />
                                    <canvas id="pixel-canvas" class="absolute inset-0 w-full h-full" style="display:none;"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Settings -->
                <div>
                    <div class="step-label mb-3">
                        <span class="step-number">2</span>
                        <span class="step-title">Settings</span>
                    </div>
                    <div class="tool-options-card mb-6">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-white mb-2">Pixel Size</label>
                                <input type="range" id="pixel-size" min="2" max="50" value="10" class="w-full accent-accent" />
                                <div class="flex justify-between text-xs text-gray-400 mt-1"><span>2px</span><span id="pixel-size-val">10px</span><span>50px</span></div>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-white mb-2">Shape</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <button id="shape-square" class="channel-btn active">Square</button>
                                    <button id="shape-round" class="channel-btn">Round</button>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-white mb-2">Intensity</label>
                                <input type="range" id="pixel-intensity" min="0" max="100" value="100" class="w-full accent-accent" />
                                <div class="flex justify-between text-xs text-gray-400 mt-1"><span>0%</span><span id="pixel-intensity-val">100%</span><span>100%</span></div>
                            </div>
                            <button id="process-btn" class="process-btn w-full" disabled>
                                <i data-lucide="zap" class="w-4 h-4"></i>
                                Apply Pixelate
                            </button>
                            <button id="download-btn" class="btn-secondary w-full" disabled>
                                <i data-lucide="download" class="w-4 h-4"></i>
                                Download
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-white/5 py-8">
        <div class="mx-auto max-w-7xl px-6 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded bg-accent/10 border border-accent/20 flex items-center justify-center text-accent text-xs font-bold">⚡</div>
                <span class="text-sm font-semibold text-white">ZyncTools</span>
            </div>
            <p class="text-xs text-gray-500">100% client-side. No uploads. No tracking.</p>
        </div>
    </footer>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/tools/image-filters-logic.js"></script>
    <script>
        (function() {
            'use strict';
            var state = { file: null, pixelSize: 10, shape: 'square', intensity: 100, resultBlob: null };

            function escapeHtml(str) {
                if (!str) return ''
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function formatFileSize(bytes) {
                if (!bytes && bytes !== 0) return '0 Bytes';
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            var dropZone = document.getElementById('drop-zone');
            var fileInput = document.getElementById('file-input');
            var previewSection = document.getElementById('preview-section');
            var previewImage = document.getElementById('preview-image');
            var pixelCanvas = document.getElementById('pixel-canvas');
            var processBtn = document.getElementById('process-btn');
            var downloadBtn = document.getElementById('download-btn');

            dropZone.addEventListener('click', function() { fileInput.click(); });
            dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
            dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
            dropZone.addEventListener('drop', function(e) {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            });
            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length) handleFile(e.target.files[0]);
            });

            function handleFile(file) {
                if (!file.type.startsWith('image/')) return;
                state.file = file;
                previewImage.onload = function() {
                    previewSection.classList.remove('hidden');
                    processBtn.disabled = false;
                    pixelCanvas.width = previewImage.naturalWidth;
                    pixelCanvas.height = previewImage.naturalHeight;
                    applyPixelate();
                };
                previewImage.src = URL.createObjectURL(file);
            }

            function applyPixelate() {
                if (!state.file) return;
                var img = new Image();
                img.onload = function() {
                    var w = img.naturalWidth, h = img.naturalHeight;
                    pixelCanvas.width = w;
                    pixelCanvas.height = h;
                    var ctx = pixelCanvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    var size = state.pixelSize;
                    var intensity = state.intensity / 100;

                    if (intensity > 0) {
                        for (let y = 0; y < h; y += size) {
                            for (let x = 0; x < w; x += size) {
                                var pw = Math.min(size, w - x);
                                var ph = Math.min(size, h - y);
                                var imageData = ctx.getImageData(x, y, pw, ph);
                                var data = imageData.data;
                                var r = 0, g = 0, b = 0, count = 0;
                                for (let i = 0; i < data.length; i += 4) {
                                    r += data[i]; g += data[i+1]; b += data[i+2]; count++;
                                }
                                r = Math.round(r / count); g = Math.round(g / count); b = Math.round(b / count);

                                if (state.shape === 'round') {
                                    var cx = x + pw/2, cy = y + ph/2;
                                    var radius = Math.min(pw, ph) / 2;
                                    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
                                    ctx.beginPath();
                                    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                                    ctx.fill();
                                } else {
                                    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
                                    ctx.fillRect(x, y, pw, ph);
                                }
                            }
                        }
                    }

                    pixelCanvas.style.display = 'block';
                    previewImage.style.opacity = 1 - intensity;
                };
                img.src = URL.createObjectURL(state.file);
            }

            // Sliders
            ['pixel-size', 'pixel-intensity'].forEach(function(id) {
                var el = document.getElementById(id);
                var valEl = document.getElementById(id + '-val');
                if (el && valEl) {
                    el.addEventListener('input', function() {
                        var suffix = id === 'pixel-size' ? 'px' : '%';
                        valEl.textContent = el.value + suffix;
                        if (id === 'pixel-size') state.pixelSize = parseInt(el.value);
                        if (id === 'pixel-intensity') state.intensity = parseInt(el.value);
                        applyPixelate();
                    });
                }
            });

            // Shape buttons
            document.getElementById('shape-square').addEventListener('click', function() {
                this.classList.add('active');
                document.getElementById('shape-round').classList.remove('active');
                state.shape = 'square';
                applyPixelate();
            });
            document.getElementById('shape-round').addEventListener('click', function() {
                this.classList.add('active');
                document.getElementById('shape-square').classList.remove('active');
                state.shape = 'round';
                applyPixelate();
            });

            processBtn.addEventListener('click', function() {
                pixelCanvas.toBlob(function(blob) {
                    state.resultBlob = blob;
                    downloadBtn.disabled = false;
                    var link = document.createElement('a');
                    link.download = (state.file.name.replace(/\.[^.]+$/, '') || 'pixelated') + '.png';
                    link.href = URL.createObjectURL(blob);
                    link.click();
                }, 'image/png');
            });

            downloadBtn.addEventListener('click', function() {
                if (!state.resultBlob) return;
                var link = document.createElement('a');
                link.download = (state.file.name.replace(/\.[^.]+$/, '') || 'pixelated') + '.png';
                link.href = URL.createObjectURL(state.resultBlob);
                link.click();
            });

            var themeToggleBtn = document.getElementById('theme-toggle');
            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', function() {
                    if (window.ZyncTheme) window.ZyncTheme.toggle();
                    else if (window.themeManager) window.themeManager.toggle();
                });
            }

            if (window.lucide) lucide.createIcons();
        })();
    </script>
</body>
</html>
