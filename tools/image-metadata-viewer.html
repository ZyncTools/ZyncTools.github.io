<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Metadata Viewer | ZyncTools</title>
    <meta name="description" content="View detailed image metadata and EXIF data. 100% client-side.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%236366F1'>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { inter: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        slate: { 950: '#0F1115', 900: '#13151A', 850: '#1C1F26', 800: '#23262F', 700: '#2D313A' },
                        accent: { DEFAULT: '#6366F1', light: '#818CF8', dark: '#4F46E5' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script>
        (function() {
            var themeKey = 'zync-theme-v2';
            var theme = 'dark';
            try { theme = localStorage.getItem(themeKey) || 'dark'; } catch(e) {}
            if (theme !== 'dark' && theme !== 'grass' && theme !== 'light') theme = 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.classList.add('theme-' + theme);
            document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
        })();
    </script>
    <script src="assets/js/theme.js" defer></script>
</head>
<body class="min-h-screen bg-[#0B0C10] text-white">
    <header class="border-b border-white/5 bg-[#0B0C10]">
        <div class="mx-auto max-w-7xl px-6 h-14 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-8 h-8 rounded-lg bg-accent/10 border border-accent/20 flex items-center justify-center text-accent font-bold text-lg group-hover:bg-accent/20 transition-colors">⚡</div>
                <span class="text-lg font-bold tracking-tight text-white">ZyncTools</span>
            </a>
            <nav class="hidden md:flex items-center gap-8">
                <a href="/" class="text-sm text-gray-400 hover:text-white transition-colors">All Tools</a>
                <button id="theme-toggle" class="text-sm text-gray-400 hover:text-white transition-colors" aria-label="Toggle theme">
                    <i data-lucide="moon" class="w-4 h-4"></i>
                </button>
            </nav>
        </div>
    </header>

    <main class="py-10">
        <div class="mx-auto max-w-7xl px-6">
            <div class="mb-8">
                <div class="flex items-center gap-4 mb-2">
                    <div class="w-12 h-12 rounded-xl bg-accent/10 border border-accent/20 flex items-center justify-center text-accent text-xl">
                        <i data-lucide="info" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Image Metadata Viewer</h1>
                        <p class="text-gray-400 mt-1">Inspect image properties, EXIF data, and technical details.</p>
                    </div>
                </div>
            </div>

            <!-- Upload -->
            <div class="mb-8">
                <div class="step-label mb-3">
                    <span class="step-number">1</span>
                    <span class="step-title">Upload Image</span>
                </div>
                <div id="drop-zone" class="drop-zone">
                    <div class="pointer-events-none">
                        <svg class="w-12 h-12 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        <p class="text-white font-medium mb-1">Drag & drop an image here</p>
                        <p class="text-gray-500 text-sm">or click to browse</p>
                    </div>
                    <input type="file" id="file-input" accept="image/*" class="hidden" />
                </div>
                <div id="preview-section" class="mt-6 hidden">
                    <div class="preview-card">
                        <img id="preview-image" class="preview-image" />
                    </div>
                </div>
            </div>

            <!-- Metadata -->
            <div id="metadata-section" class="hidden">
                <div class="step-label mb-3">
                    <span class="step-number">2</span>
                    <span class="step-title">Metadata</span>
                </div>
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">File Information</h3>
                        <div id="file-info" class="space-y-3"></div>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">Image Properties</h3>
                        <div id="image-props" class="space-y-3"></div>
                    </div>
                </div>
                <div class="mt-6">
                    <button id="copy-metadata" class="btn-secondary">
                        <i data-lucide="copy" class="w-4 h-4"></i> Copy Metadata as JSON
                    </button>
                    <button id="export-metadata" class="btn-secondary ml-3">
                        <i data-lucide="download" class="w-4 h-4"></i> Export JSON
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-white/5 py-8">
        <div class="mx-auto max-w-7xl px-6 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded bg-accent/10 border border-accent/20 flex items-center justify-center text-accent text-xs font-bold">⚡</div>
                <span class="text-sm font-semibold text-white">ZyncTools</span>
            </div>
            <p class="text-xs text-gray-500">100% client-side. No uploads. No tracking.</p>
        </div>
    </footer>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/tools/image-filters-logic.js"></script>
    <script>
        (function() {
            'use strict';
            var state = { file: null, metadata: null };

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            var dropZone = document.getElementById('drop-zone');
            var fileInput = document.getElementById('file-input');
            var previewSection = document.getElementById('preview-section');
            var previewImage = document.getElementById('preview-image');

            dropZone.addEventListener('click', function() { fileInput.click(); });
            dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
            dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
            dropZone.addEventListener('drop', function(e) {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            });
            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length) handleFile(e.target.files[0]);
            });

            function handleFile(file) {
                if (!file.type.startsWith('image/')) return;
                state.file = file;
                previewImage.onload = function() {
                    previewSection.classList.remove('hidden');
                    loadMetadata();
                };
                previewImage.src = URL.createObjectURL(file);
            }

            async function loadMetadata() {
                var bmp = await createImageBitmap(state.file);
                var ext = state.file.name.split('.').pop().toLowerCase();
                var aspectRatio = (bmp.width / bmp.height).toFixed(2);
                state.metadata = {
                    filename: state.file.name,
                    extension: ext,
                    width: bmp.width + 'px',
                    height: bmp.height + 'px',
                    fileSize: formatFileSize(state.file.size),
                    aspectRatio: aspectRatio,
                    colorSpace: 'sRGB',
                    bitDepth: '24-bit',
                    format: state.file.type || 'image/' + ext,
                    lastModified: new Date(state.file.lastModified).toISOString()
                };

                document.getElementById('metadata-section').classList.remove('hidden');
                renderMetadata();
            }

            function formatFileSize(bytes) {
                if (!bytes && bytes !== 0) return '0 Bytes';
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            function renderMetadata() {
                var fileInfo = document.getElementById('file-info');
                var imageProps = document.getElementById('image-props');
                var m = state.metadata;

                var fileFields = [
                    { label: 'Filename', value: m.filename },
                    { label: 'Extension', value: m.extension },
                    { label: 'Format', value: m.format },
                    { label: 'File Size', value: m.fileSize },
                    { label: 'Last Modified', value: m.lastModified }
                ];

                var propFields = [
                    { label: 'Dimensions', value: m.width + ' x ' + m.height },
                    { label: 'Aspect Ratio', value: m.aspectRatio },
                    { label: 'Color Space', value: m.colorSpace },
                    { label: 'Bit Depth', value: m.bitDepth }
                ];

                fileInfo.innerHTML = fileFields.map(function(f) {
                    return '<div class="flex justify-between items-center py-2 border-b border-white/5"><span class="text-sm text-gray-400">' + f.label + '</span><span class="text-sm font-semibold text-white text-right max-w-[60%] truncate">' + escapeHtml(f.value) + '</span></div>';
                }).join('');

                imageProps.innerHTML = propFields.map(function(f) {
                    return '<div class="flex justify-between items-center py-2 border-b border-white/5"><span class="text-sm text-gray-400">' + f.label + '</span><span class="text-sm font-semibold text-white text-right max-w-[60%] truncate">' + escapeHtml(f.value) + '</span></div>';
                }).join('');
            }

            document.getElementById('copy-metadata').addEventListener('click', function() {
                if (!state.metadata) return;
                navigator.clipboard.writeText(JSON.stringify(state.metadata, null, 2)).then(function() {
                    var btn = document.getElementById('copy-metadata');
                    btn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Copied';
                    if (window.lucide) lucide.createIcons();
                    setTimeout(function() {
                        btn.innerHTML = '<i data-lucide="copy" class="w-4 h-4"></i> Copy Metadata as JSON';
                        if (window.lucide) lucide.createIcons();
                    }, 2000);
                });
            });

            document.getElementById('export-metadata').addEventListener('click', function() {
                if (!state.metadata) return;
                var blob = new Blob([JSON.stringify(state.metadata, null, 2)], { type: 'application/json' });
                var link = document.createElement('a');
                link.download = (state.file.name.replace(/\.[^.]+$/, '') || 'metadata') + '.json';
                link.href = URL.createObjectURL(blob);
                link.click();
            });

            var themeToggleBtn = document.getElementById('theme-toggle');
            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', function() {
                    if (window.ZyncTheme) window.ZyncTheme.toggle();
                    else if (window.themeManager) window.themeManager.toggle();
                });
            }

            if (window.lucide) lucide.createIcons();
        })();
    </script>
</body>
</html>
