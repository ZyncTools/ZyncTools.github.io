<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete PDF Pages — Free, Private, Fast | ZyncTools</title>
    <meta name="description" content="Delete multiple pages from PDF documents. 100% client-side, no uploads. Support for single pages, ranges, and odd/even pages.">
    <link rel="icon" href="assets/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script>
        (function() {
            var themeKey = 'zync-theme-v2';
            var theme = 'dark';
            try { theme = localStorage.getItem(themeKey) || 'dark'; } catch(e) {}
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.classList.add('theme-' + theme);
            document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
        })();
    </script>
    <script>window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <style>
        .page-select-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
            padding: 4px;
        }
        .page-select-item {
            position: relative;
            border: 2px solid var(--border-medium);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.15s ease;
            aspect-ratio: 3/4;
            background: var(--bg-surface);
            display: flex;
            flex-direction: column;
        }
        .page-select-item:hover { border-color: var(--accent); }
        .page-select-item.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-tint);
            background: var(--accent-tint);
        }
        .page-select-item.selected .page-del-check {
            display: flex;
        }
        .page-select-item canvas {
            width: 100%;
            flex: 1;
            object-fit: contain;
        }
        .page-select-num {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px;
            background: var(--bg-card);
            color: var(--text-secondary);
        }
        .page-del-check {
            display: none;
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--danger);
            color: white;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
<header class="border-b border-white/5 bg-[#0B0C10]">
    <div class="mx-auto max-w-7xl px-6 h-14 flex items-center justify-between">
        <a href="/" class="flex items-center gap-3 group">
            <div class="w-8 h-8 rounded-lg bg-accent/10 border border-accent/20 flex items-center justify-center text-accent font-bold text-lg group-hover:bg-accent/20 transition-colors">⚡</div>
            <span class="text-lg font-bold tracking-tight text-white">ZyncTools</span>
        </a>
        <nav class="hidden md:flex items-center gap-8">
            <a href="/" class="text-sm text-gray-400 hover:text-white transition-colors">All Tools</a>
        </nav>
    </div>
</header>
<main class="py-8">
    <div class="mx-auto max-w-7xl px-6">
        <div class="flex items-center gap-4 mb-6">
            <div class="w-12 h-12 rounded-xl bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-500 text-xl">
                <i class="fas fa-trash-2"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Delete PDF Pages</h1>
                <p class="text-gray-400 mt-1">Select pages to remove from your PDF.</p>
            </div>
        </div>

        <div id="upload-area" class="mb-8">
            <div class="step-label mb-3"><span class="step-number">1</span><span class="step-title">Upload Document</span></div>
            <div id="drop-zone" class="drop-zone">
                <svg class="w-12 h-12 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                <p class="text-white font-medium mb-1">Drag & drop your PDF here</p>
                <p class="text-gray-500 text-sm">or click to browse</p>
                <input type="file" id="file-input" accept=".pdf" class="hidden">
            </div>
        </div>

        <div id="file-info" class="mb-6 hidden">
            <div class="sidebar-card flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-500"><i class="fas fa-file-pdf"></i></div>
                <div class="flex-1 min-w-0">
                    <div class="font-semibold text-sm text-white truncate" id="file-name">document.pdf</div>
                    <div class="text-xs text-gray-500" id="file-size">0 KB</div>
                </div>
                <button id="replace-file-btn" class="btn btn-secondary btn-sm"><i class="fas fa-rotate-right"></i> Replace</button>
            </div>
        </div>

        <div id="pdf-workbench-area" class="hidden">
            <div class="pdf-workbench" style="height:auto;">
                <div class="pdf-main-viewer" style="min-height:600px">
                    <div class="pdf-toolbar">
                        <div class="pdf-toolbar-group">
                            <button class="pdf-toolbar-btn" id="prev-page"><i class="fas fa-chevron-up"></i></button>
                            <div class="pdf-page-nav"><span><input type="number" id="page-input" class="pdf-page-input" value="1" min="1"></span><span>/</span><span id="total-pages-span">1</span></div>
                            <button class="pdf-toolbar-btn" id="next-page"><i class="fas fa-chevron-down"></i></button>
                        </div>
                        <div class="pdf-toolbar-group">
                            <button class="pdf-toolbar-btn" id="zoom-out"><i class="fas fa-magnifying-glass-minus"></i></button>
                            <span class="text-xs text-gray-400 font-semibold" id="zoom-level">100%</span>
                            <button class="pdf-toolbar-btn" id="zoom-in"><i class="fas fa-magnifying-glass-plus"></i></button>
                            <button class="pdf-toolbar-btn" id="fit-width"><i class="fas fa-arrows-left-right"></i></button>
                            <button class="pdf-toolbar-btn" id="rotate-btn"><i class="fas fa-rotate-right"></i></button>
                        </div>
                    </div>
                    <div class="pdf-canvas-container" id="pdf-canvas-container">
                        <div class="pdf-canvas-wrapper" id="pdf-canvas-wrapper">
                            <canvas id="pdf-current-canvas"></canvas>
                        </div>
                    </div>
                </div>
                <div class="pdf-tools-panel">
                    <div class="tool-panel-card">
                        <div class="tool-panel-title"><i class="fas fa-trash-2 mr-1"></i> Select Pages to Delete</div>
                        <div id="page-select-grid" class="page-select-grid"></div>
                        <div class="mt-3 flex gap-2">
                            <button id="select-all-btn" class="btn btn-secondary btn-sm btn-full"><i class="fas fa-check-double"></i> Select All</button>
                            <button id="deselect-all-btn" class="btn btn-secondary btn-sm btn-full"><i class="fas fa-xmark"></i> Deselect All</button>
                        </div>
                    </div>
                    <div class="tool-panel-card">
                        <div class="tool-panel-title"><i class="fas fa-file-export mr-1"></i> Actions</div>
                        <button id="delete-now-btn" class="btn btn-primary btn-full mb-2" disabled>
                            <i class="fas fa-trash"></i> Delete Selected Pages
                        </button>
                        <button id="download-btn" class="btn btn-primary btn-full mb-2" style="background:var(--success)">
                            <i class="fas fa-download"></i> Download Updated PDF
                        </button>
                        <button id="reset-btn" class="btn btn-secondary btn-full"><i class="fas fa-rotate-left"></i> Reset</button>
                    </div>
                    <div class="tool-panel-card">
                        <div class="tool-panel-title"><i class="fas fa-circle-info mr-1"></i> Document Info</div>
                        <div class="text-sm text-gray-500 space-y-1">
                            <div class="flex justify-between"><span>Total pages:</span><span id="info-pages" class="text-white font-semibold">-</span></div>
                            <div class="flex justify-between"><span>Selected:</span><span id="info-selected" class="text-red-400 font-semibold">0</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div id="loading-overlay" class="pdf-overlay">
    <div class="pdf-progress-card">
        <div class="text-2xl font-bold text-white mb-2"><i class="fas fa-spinner fa-spin"></i></div>
        <div class="text-sm text-gray-400 font-semibold" id="loading-text">Processing...</div>
        <div class="pdf-progress-bar-wrap"><div class="pdf-progress-bar-fill" id="loading-progress"></div></div>
    </div>
</div>
<div id="drop-overlay" class="pdf-upload-overlay"><div class="pdf-drop-indicator"><i class="fas fa-cloud-arrow-up text-5xl text-accent"></i><p class="text-lg font-bold text-white">Drop your PDF here</p></div></div>
<div id="toast-el" class="toast"></div>

<script src="assets/js/pdf-workbench-core.js"></script>
<script>
(function() {
  var $ = function(id) { return document.getElementById(id); };
  var pdfDoc = null;
  var currentPage = 1;
  var totalPages = 0;
  var zoomScale = 1.2;
  var selectedPages = new Set();
  var loadedFile = null;
  
  function formatBytes(b) {
    if (b === 0) return '0 B';
    var k = 1024;
    var sizes = ['B', 'KB', 'MB', 'GB'];
    var i = Math.floor(Math.log(b) / Math.log(k));
    return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
  }
  
  function showToast(msg, type) {
    var t = $('toast-el');
    t.textContent = msg;
    t.className = 'toast toast-' + (type || 'info') + ' visible';
    clearTimeout(t._timer);
    t._timer = setTimeout(function() { t.classList.remove('visible'); }, 3000);
  }
  
  function showLoading(text, progress) {
    $('loading-text').textContent = text || 'Processing...';
    $('loading-progress').style.width = (progress || 0) + '%';
    $('loading-overlay').classList.add('visible');
    if (progress >= 100) setTimeout(function() { $('loading-overlay').classList.remove('visible'); }, 400);
  }
  
  function hideLoading() { $('loading-overlay').classList.remove('visible'); }
  
  var dropZone = $('drop-zone');
  var fileInput = $('file-input');
  var dropOverlay = $('drop-overlay');
  
  dropZone.addEventListener('click', function() { fileInput.click(); });
  fileInput.addEventListener('change', function(e) { if (e.target.files[0]) handleFile(e.target.files[0]); });
  dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
  dropZone.addEventListener('drop', function(e) { e.preventDefault(); dropZone.classList.remove('drag-over'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  document.addEventListener('dragenter', function(e) { if (e.dataTransfer.types.includes('Files')) dropOverlay.classList.add('visible'); });
  document.addEventListener('dragover', function(e) { e.preventDefault(); });
  document.addEventListener('dragleave', function(e) { if (e.target === dropOverlay) dropOverlay.classList.remove('visible'); });
  document.addEventListener('drop', function(e) { e.preventDefault(); dropOverlay.classList.remove('visible'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  
  function handleFile(file) {
    if (file.type !== 'application/pdf' && !file.name.endsWith('.pdf')) {
      showToast('Please upload a PDF file', 'error');
      return;
    }
    $('file-name').textContent = file.name;
    $('file-size').textContent = formatBytes(file.size);
    $('file-info').classList.remove('hidden');
    showLoading('Loading PDF...', 30);
    initPdfReader(file).then(function() {
      hideLoading();
      showToast('PDF loaded: ' + totalPages + ' pages', 'success');
    }).catch(function(e) {
      hideLoading();
      showToast('Error: ' + e.message, 'error');
    });
  }
  
  async function initPdfReader(file) {
    pdfDoc = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    totalPages = pdfDoc.numPages;
    currentPage = 1;
    zoomScale = 1.2;
    loadedFile = file;
    selectedPages.clear();
    
    $('total-pages-span').textContent = totalPages;
    $('page-input').max = totalPages;
    $('page-input').value = 1;
    $('info-pages').textContent = totalPages;
    $('info-selected').textContent = '0';
    
    $('upload-area').classList.add('hidden');
    $('pdf-workbench-area').classList.remove('hidden');
    
    await renderCurrentPage();
    await buildThumbnails();
    await buildPageGrid();
  }
  
  async function renderCurrentPage() {
    if (!pdfDoc) return;
    var canvas = $('pdf-current-canvas');
    try {
      var page = await pdfDoc.getPage(currentPage);
      var viewport = page.getViewport({ scale: zoomScale });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      var wrapper = $('pdf-canvas-wrapper');
      wrapper.style.width = viewport.width + 'px';
      wrapper.style.height = viewport.height + 'px';
      var ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    } catch (e) { console.error('Render:', e); }
  }
  
  async function buildThumbnails() {
    var container = document.createElement('div');
    container.className = 'pdf-thumbnails';
    for (var i = 1; i <= totalPages; i++) {
      try {
        var page = await pdfDoc.getPage(i);
        var nativeViewport = page.getViewport({ scale: 1 });
        var thumbScale = 160 / nativeViewport.width;
        var viewport = page.getViewport({ scale: thumbScale });
        var canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        var ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        
        // We skip the sidebar thumbnails in this simplified layout, focusing on the page grid instead
      } catch (e) {}
    }
  }
  
  async function buildPageGrid() {
    var grid = $('page-select-grid');
    grid.innerHTML = '';
    var promises = [];
    for (var i = 1; i <= totalPages; i++) {
      (function(pageNum) {
        promises.push((async function() {
          try {
            var page = await pdfDoc.getPage(pageNum);
            var nativeViewport = page.getViewport({ scale: 1 });
            var thumbScale = 200 / nativeViewport.width;
            var viewport = page.getViewport({ scale: thumbScale });
            var canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            var ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            
            var item = document.createElement('div');
            item.className = 'page-select-item';
            item.dataset.page = pageNum;
            item.innerHTML = '<div class="page-del-check"><i class="fas fa-check"></i></div><canvas></canvas><div class="page-select-num">Page ' + pageNum + '</div>';
            var cvs = item.querySelector('canvas');
            cvs.getContext('2d').drawImage(canvas, 0, 0);
            
            item.addEventListener('click', function() {
              if (selectedPages.has(pageNum)) {
                selectedPages.delete(pageNum);
                item.classList.remove('selected');
              } else {
                selectedPages.add(pageNum);
                item.classList.add('selected');
              }
              $('info-selected').textContent = selectedPages.size;
              $('delete-now-btn').disabled = selectedPages.size === 0;
            });
            
            grid.appendChild(item);
          } catch (e) {
            var item = document.createElement('div');
            item.className = 'page-select-item';
            item.dataset.page = pageNum;
            item.innerHTML = '<div class="page-del-check"><i class="fas fa-check"></i></div><div style="padding:20px;text-align:center;font-size:0.7rem;color:var(--text-muted)">Page ' + pageNum + '</div>';
            grid.appendChild(item);
          }
        })());
      })(i);
    }
    await Promise.all(promises);
  }
  
  function goToPage(page) {
    if (!pdfDoc || page < 1 || page > totalPages) return;
    currentPage = page;
    $('page-input').value = page;
    renderCurrentPage();
  }
  
  $('prev-page').addEventListener('click', function() { goToPage(currentPage - 1); });
  $('next-page').addEventListener('click', function() { goToPage(currentPage + 1); });
  $('page-input').addEventListener('change', function() { goToPage(parseInt($('page-input').value) || 1); });
  $('zoom-in').addEventListener('click', function() {
    zoomScale = Math.min(zoomScale + 0.2, 5);
    $('zoom-level').textContent = Math.round(zoomScale * 100) + '%';
    renderCurrentPage();
  });
  $('zoom-out').addEventListener('click', function() {
    zoomScale = Math.max(zoomScale - 0.2, 0.3);
    $('zoom-level').textContent = Math.round(zoomScale * 100) + '%';
    renderCurrentPage();
  });
  $('fit-width').addEventListener('click', function() {
    if (!pdfDoc) return;
    pdfDoc.getPage(currentPage).getViewport({ scale: 1 }).then(function(viewport) {
      zoomScale = ($('pdf-canvas-container').clientWidth - 40) / viewport.width;
      zoomScale = Math.max(0.3, Math.min(zoomScale, 5));
      $('zoom-level').textContent = Math.round(zoomScale * 100) + '%';
      renderCurrentPage();
    });
  });
  $('rotate-btn').addEventListener('click', function() {
    var canvas = $('pdf-current-canvas');
    var ctx = canvas.getContext('2d');
    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.translate(canvas.height, 0);
    ctx.rotate(90 * Math.PI / 180);
    ctx.drawImage(canvas, 0, 0);
    ctx.restore();
  });
  
  $('select-all-btn').addEventListener('click', function() {
    document.querySelectorAll('.page-select-item').forEach(function(el) {
      var p = parseInt(el.dataset.page);
      selectedPages.add(p);
      el.classList.add('selected');
    });
    $('info-selected').textContent = selectedPages.size;
    $('delete-now-btn').disabled = selectedPages.size === 0;
  });
  
  $('deselect-all-btn').addEventListener('click', function() {
    selectedPages.clear();
    document.querySelectorAll('.page-select-item').forEach(function(el) { el.classList.remove('selected'); });
    $('info-selected').textContent = '0';
    $('delete-now-btn').disabled = true;
  });
  
  $('replace-file-btn').addEventListener('click', function() {
    fileInput.value = '';
    fileInput.click();
  });
  
  $('download-btn').addEventListener('click', async function() {
    if (!pdfDoc || !loadedFile) return;
    showLoading('Processing...', 30);
    try {
      var PDFLib = window.PDFLib;
      var bytes = new Uint8Array(await loadedFile.arrayBuffer());
      var doc = await PDFLib.PDFDocument.load(bytes);
      var pageIndicesToDelete = [];
      for (var i = 0; i < doc.getPageCount(); i++) {
        if (selectedPages.has(i + 1)) pageIndicesToDelete.push(i);
      }
      // Delete from highest to lowest to keep indices valid
      for (var j = pageIndicesToDelete.length - 1; j >= 0; j--) {
        doc.removePage(pageIndicesToDelete[j]);
      }
      var outBytes = await doc.save();
      var blob = new Blob([outBytes], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'deleted-pages.pdf';
      a.click();
      URL.revokeObjectURL(url);
      hideLoading();
      showToast('PDF downloaded successfully!', 'success');
    } catch (e) {
      hideLoading();
      showToast('Error: ' + e.message, 'error');
    }
  });
  
  $('delete-now-btn').addEventListener('click', async function() {
    if (!pdfDoc || !loadedFile) return;
    showLoading('Deleting pages...', 30);
    try {
      var PDFLib = window.PDFLib;
      var bytes = new Uint8Array(await loadedFile.arrayBuffer());
      var doc = await PDFLib.PDFDocument.load(bytes);
      var pageIndicesToDelete = [];
      for (var i = 0; i < doc.getPageCount(); i++) {
        if (selectedPages.has(i + 1)) pageIndicesToDelete.push(i);
      }
      for (var j = pageIndicesToDelete.length - 1; j >= 0; j--) {
        doc.removePage(pageIndicesToDelete[j]);
      }
      totalPages = doc.getPageCount();
      // Update
      var outBytes = await doc.save();
      loadedFile = new Blob([outBytes], { type: 'application/pdf' });
      loadedFile.name = selectedPages.size + ' pages deleted.pdf';
      selectedPages.clear();
      
      // Re-render
      $('info-pages').textContent = totalPages;
      $('info-selected').textContent = '0';
      $('delete-now-btn').disabled = true;
      
      pdfDoc = await window.pdfjsLib.getDocument({ data: new Uint8Array(outBytes) }).promise;
      currentPage = 1;
      $('total-pages-span').textContent = totalPages;
      $('page-input').max = totalPages;
      $('page-input').value = 1;
      await renderCurrentPage();
      await buildPageGrid();
      hideLoading();
      showToast('Pages deleted! ' + totalPages + ' pages remaining', 'success');
    } catch (e) {
      hideLoading();
      showToast('Error: ' + e.message, 'error');
    }
  });
  
  $('reset-btn').addEventListener('click', function() {
    $('upload-area').classList.remove('hidden');
    $('pdf-workbench-area').classList.add('hidden');
    $('file-info').classList.add('hidden');
    fileInput.value = '';
    pdfDoc = null;
    selectedPages.clear();
  });
  
  $('replace-file-btn').addEventListener('click', function() {
    fileInput.value = '';
    fileInput.click();
  });
  
  window.addGlobalListener('drop', function(e) { if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
})();
</script>
</body>
</html>
