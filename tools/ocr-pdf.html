<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR PDF | ZyncTools</title>
    <meta name="description" content="OCR scanned PDFs to extract text. 100% client-side.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%236366F1'>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { inter: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        slate: { 950: '#0F1115', 900: '#13151A', 850: '#1C1F26', 800: '#23262F', 700: '#2D313A' },
                        accent: { DEFAULT: '#6366F1', light: '#818CF8', dark: '#4F46E5' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script>
        (function() {
            var themeKey = 'zync-theme-v2';
            var theme = 'dark';
            try { theme = localStorage.getItem(themeKey) || 'dark'; } catch(e) {}
            if (theme !== 'dark' && theme !== 'grass' && theme !== 'light') theme = 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.classList.add('theme-' + theme);
            document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
        })();
    </script>
    <script src="assets/js/theme.js" defer></script>
</head>
<body class="min-h-screen bg-[#0B0C10] text-white">
    <header class="border-b border-white/5 bg-[#0B0C10]">
        <div class="mx-auto max-w-7xl px-6 h-14 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-8 h-8 rounded-lg bg-accent/10 border border-accent/20 flex items-center justify-center text-accent font-bold text-lg group-hover:bg-accent/20 transition-colors">⚡</div>
                <span class="text-lg font-bold tracking-tight text-white">ZyncTools</span>
            </a>
            <nav class="hidden md:flex items-center gap-8">
                <a href="/" class="text-sm text-gray-400 hover:text-white transition-colors">All Tools</a>
                <button id="theme-toggle" class="text-sm text-gray-400 hover:text-white transition-colors" aria-label="Toggle theme">
                    <i data-lucide="moon" class="w-4 h-4"></i>
                </button>
            </nav>
        </div>
    </header>

    <main class="py-10">
        <div class="mx-auto max-w-7xl px-6">
            <div class="mb-8">
                <div class="flex items-center gap-4 mb-2">
                    <div class="w-12 h-12 rounded-xl bg-accent/10 border border-accent/20 flex items-center justify-center text-accent text-xl">
                        <i data-lucide="scan-text" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">OCR PDF</h1>
                        <p class="text-gray-400 mt-1">Extract text from scanned PDFs using OCR.</p>
                    </div>
                </div>
            </div>

            <div class="grid lg:grid-cols-2 gap-6">
                <div>
                    <div class="step-label mb-3">
                        <span class="step-number">1</span>
                        <span class="step-title">Upload Scanned PDF</span>
                    </div>
                    <div id="drop-zone" class="drop-zone">
                        <div class="pointer-events-none">
                            <svg class="w-12 h-12 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                            <p class="text-white font-medium mb-1">Drag & drop scanned PDF here</p>
                            <p class="text-gray-500 text-sm">OCR will extract text from images</p>
                        </div>
                        <input type="file" id="file-input" accept=".pdf" class="hidden" />
                    </div>
                    <div id="preview-section" class="mt-4 hidden">
                        <div class="preview-card">
                            <img id="preview-image" class="preview-image" />
                        </div>
                    </div>
                </div>
                <div>
                    <div class="step-label mb-3">
                        <span class="step-number">2</span>
                        <span class="step-title">Settings</span>
                    </div>
                    <div class="tool-options-card mb-6">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-white mb-2">Language</label>
                                <select id="ocr-language" class="w-full bg-[#111318] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-gray-200">
                                    <option value="eng">English</option>
                                    <option value="spa">Spanish</option>
                                    <option value="fra">French</option>
                                    <option value="deu">German</option>
                                    <option value="chi_sim">Chinese (Simplified)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-white mb-2">Output</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <button id="out-searchable" class="mode-btn active">Searchable PDF</button>
                                    <button id="out-text" class="mode-btn">Text Only</button>
                                </div>
                            </div>
                            <button id="process-btn" class="process-btn w-full" disabled>
                                <i data-lucide="scan" class="w-4 h-4"></i> Run OCR
                            </button>
                        </div>
                    </div>

                    <div id="result-section" class="hidden">
                        <div class="step-label mb-3">
                            <span class="step-number">3</span>
                            <span class="step-title">Extracted Text</span>
                        </div>
                        <div class="tool-options-card">
                            <textarea id="ocr-output" rows="10" readonly class="w-full bg-[#111318] border border-white/10 rounded-xl p-4 text-sm text-gray-300 font-mono resize-none"></textarea>
                            <div class="flex gap-3 mt-4">
                                <button id="copy-btn" class="btn-secondary flex-1"><i data-lucide="copy" class="w-4 h-4"></i> Copy Text</button>
                                <button id="download-btn" class="btn-secondary flex-1"><i data-lucide="download" class="w-4 h-4"></i> Download TXT</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-white/5 py-8">
        <div class="mx-auto max-w-7xl px-6 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded bg-accent/10 border border-accent/20 flex items-center justify-center text-accent text-xs font-bold">⚡</div>
                <span class="text-sm font-semibold text-white">ZyncTools</span>
            </div>
            <p class="text-xs text-gray-500">100% client-side. No uploads. No tracking.</p>
        </div>
    </footer>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        (function() {
            'use strict';
            var state = { file: null, text: null, outputType: 'searchable' };

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            var dropZone = document.getElementById('drop-zone');
            var fileInput = document.getElementById('file-input');
            var previewSection = document.getElementById('preview-section');
            var previewImage = document.getElementById('preview-image');
            var processBtn = document.getElementById('process-btn');
            var resultSection = document.getElementById('result-section');
            var ocrOutput = document.getElementById('ocr-output');

            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            dropZone.addEventListener('click', function() { fileInput.click(); });
            dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
            dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
            dropZone.addEventListener('drop', function(e) {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            });
            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length) handleFile(e.target.files[0]);
            });

            function handleFile(file) {
                if (file.type !== 'application/pdf') return;
                state.file = file;
                previewImage.onload = function() { previewSection.classList.remove('hidden'); processBtn.disabled = false; };
                previewImage.src = URL.createObjectURL(file);
            }

            document.getElementById('out-searchable').addEventListener('click', function() {
                this.classList.add('active');
                document.getElementById('out-text').classList.remove('active');
                state.outputType = 'searchable';
            });
            document.getElementById('out-text').addEventListener('click', function() {
                this.classList.add('active');
                document.getElementById('out-searchable').classList.remove('active');
                state.outputType = 'text';
            });

            processBtn.addEventListener('click', async function() {
                if (!state.file) return;
                processBtn.disabled = true;
                processBtn.innerHTML = '<span class="animate-spin inline-block w-4 h-4 border-2 border-white/20 border-t-white rounded-full mr-2"></span>Running OCR...';
                try {
                    const lang = document.getElementById('ocr-language').value;
                    const result = await Tesseract.recognize(state.file, lang, { logger: m => { if (m.status === 'recognizing text') processBtn.querySelector('span').textContent = 'OCR: ' + Math.round(m.progress * 100) + '%'; } });
                    state.text = result.data.text;
                    ocrOutput.value = state.text;
                    resultSection.classList.remove('hidden');
                } catch (err) {
                    alert('Error: ' + err.message);
                } finally {
                    processBtn.disabled = false;
                    processBtn.innerHTML = '<i data-lucide="scan" class="w-4 h-4"></i> Run OCR';
                    if (window.lucide) lucide.createIcons();
                }
            });

            document.getElementById('copy-btn').addEventListener('click', function() {
                if (!state.text) return;
                navigator.clipboard.writeText(state.text);
                this.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Copied';
                if (window.lucide) lucide.createIcons();
                setTimeout(() => { this.innerHTML = '<i data-lucide="copy" class="w-4 h-4"></i> Copy Text'; if (window.lucide) lucide.createIcons(); }, 2000);
            });

            document.getElementById('download-btn').addEventListener('click', function() {
                if (!state.text) return;
                const blob = new Blob([state.text], { type: 'text/plain' });
                const link = document.createElement('a');
                link.download = (state.file.name.replace(/\.pdf$/i, '') || 'ocr') + '.txt';
                link.href = URL.createObjectURL(blob);
                link.click();
            });

            var themeToggleBtn = document.getElementById('theme-toggle');
            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', function() {
                    if (window.ZyncTheme) window.ZyncTheme.toggle();
                    else if (window.themeManager) window.themeManager.toggle();
                });
            }

            if (window.lucide) lucide.createIcons();
        })();
    </script>
</body>
</html>
